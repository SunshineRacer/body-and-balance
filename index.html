function removeSource(src){for(let [date,v] of Object.entries(state.moves))if(v===src)delete state.moves[date];for(let [date,arr] of Object.entries(state.moveExtras)){state.moveExtras[date]=arr.filter(x=>x!==src);if(!state.moveExtras[date].length)delete state.moveExtras[date]}}

function statsNew(){let entries=[];for(let [date,card] of Object.entries(state.cardio||{}))for(let kind of ['run','bike']){let x=card?.[kind];if(x&&(Number(x.min)>0||Number(x.km)>0))entries.push({date,kind,min:Number(x.min)||0,km:Number(x.km)||0})}for(let [date,arr] of Object.entries(state.extra||{}))for(let x of arr||[]){let kind=extraKind(x.name);if(kind)entries.push({date,kind,min:Number(x.min)||0,km:Number(x.km)||0,extra:true})}let selected=state.statsMode==='week'?entries.filter(x=>statsWeekNum(x.date)===week()):entries;let sections=['run','bike'].map(kind=>{let xs=selected.filter(x=>x.kind===kind),mins=xs.reduce((a,x)=>a+x.min,0),km=xs.reduce((a,x)=>a+x.km,0),allKind=entries.filter(x=>x.kind===kind),weekly=Array.from({length:12},(_,i)=>allKind.filter(x=>statsWeekNum(x.date)===i+1).reduce((a,x)=>a+x.km,0));let prior=entries.filter(x=>x.kind===kind&&statsWeekNum(x.date)===week()-1).reduce((a,x)=>a+x.km,0),current=entries.filter(x=>x.kind===kind&&statsWeekNum(x.date)===week()).reduce((a,x)=>a+x.km,0);let change=current-prior;return `<details class="panel stats-accordion"><summary><strong>${kind==='run'?'🏃 Laufen':'🚴 Radfahren'}</strong><span>${mins} Min. · ${km.toFixed(2)} km <span aria-hidden="true">⌄</span></span></summary><div class="stats-detail"><div class="two stats-compact"><div class="stat"><b>${mins}</b><small>Minuten</small></div><div class="stat"><b>${km.toFixed(2)}</b><small>Kilometer</small></div></div><p><strong>Durchschnitt:</strong> ${mins&&km?(km/(mins/60)).toFixed(2)+' km/h':'Noch nicht berechenbar'}</p><p><strong>Vergleich zur Vorwoche:</strong> ${change>0?'+':''}${change.toFixed(2)} km (${current.toFixed(2)} km aktuell)</p><h4>Entwicklung der Distanz</h4>${statsBars(weekly,'Kilometer')}${xs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(x=>`<div class="weekday"><span>${esc(x.date)}${x.extra?' · Zusatzaktivität':''}</span><span>${x.min} Min. · ${x.km.toFixed(2)} km</span></div>`).join('')||'<p class="muted">Noch keine Einträge.</p>'}</div></details>`}).join('');let dates=[...new Set([...Object.keys(state.journal||{}),...Object.keys(state.notes||{})])].filter(k=>{let j=state.journal[k]||{};return j.effort||j.mood||j.body||state.notes[k]}).sort().reverse();return `<h3>Ausdauerentwicklung</h3><div class="panel"><div class="navrow"><button class="btn ${state.statsMode==='all'?'':'secondary'}" data-stats-mode="all">Alle 12 Wochen</button><button class="btn ${state.statsMode==='week'?'':'secondary'}" data-stats-mode="week">Woche ${week()}</button></div></div>${sections}${extraStatsMarkup()}<details class="panel stats-fold" id="statsDiary" ${statsDiaryOpen?'open':''}><summary><span>📓 Trainingstagebuch</span><span class="fold-right">${dates.length} Einträge <span class="fold-chevron">⌄</span></span></summary><div class="stats-detail">${dates.map(date=>{let j=state.journal[date]||{};return `<details class="journal-history"><summary><strong>${esc(date)}</strong><span>${j.effort?'Anstrengung '+esc(j.effort)+'/10 · ':''}${esc(j.mood||'Keine Tagesform')}</span></summary><div class="stats-detail"><p><strong>Körperliches Befinden:</strong> ${esc(j.body||'–')}</p><p><strong>Notizen:</strong> ${esc(state.notes[date]||'–')}</p><button class="mini" data-journal-date="${esc(date)}">Trainingstag öffnen</button></div></details>`}).join('')||'<p class="muted">Noch keine Tagebucheinträge vorhanden. Speichere einen Eintrag im Trainingstagebuch, dann erscheint er hier.</p>'}</div></details>`}
function extraStatsMarkup(){let all=Object.entries(state.extra||{}).flatMap(([date,arr])=>(arr||[]).map(x=>({...x,date})));let xs=state.statsMode==='week'?all.filter(x=>statsWeekNum(x.date)===week()):all;let groups={};for(let x of xs){let name=x.name||'Sonstige Aktivität';groups[name]??={count:0,min:0};groups[name].count++;groups[name].min+=Number(x.min)||0}let total=xs.reduce((a,x)=>a+(Number(x.min)||0),0);let weekly=Array.from({length:12},(_,i)=>all.filter(x=>statsWeekNum(x.date)===i+1).reduce((a,x)=>a+(Number(x.min)||0),0));return `<details class="panel stats-accordion"><summary><strong>🎯 Zusätzliche Aktivitäten</strong><span>${xs.length} Aktivitäten · ${total} Min. <span aria-hidden="true">⌄</span></span></summary><div class="stats-detail"><h4>Nach Aktivitätsart</h4>${Object.entries(groups).sort((a,b)=>b[1].min-a[1].min).map(([name,x])=>`<div class="weekday"><span>${esc(name)}</span><span>${x.count}× · ${x.min} Min.</span></div>`).join('')||'<p class="muted">Noch keine zusätzlichen Aktivitäten erfasst.</p>'}<h4>Wochenvergleich</h4>${statsBars(weekly,'Minuten')}<p class="muted">Zusätzliche Aktivitäten zählen nicht als reguläre Trainingseinheiten. Lauf- und Radeinträge werden zusätzlich in der Ausdauerstatistik angezeigt.</p></div></details>`}

document.addEventListener('toggle',e=>{if(e.target.id==='journalForm'){journalOpen=e.target.open;}if(e.target.id==='statsWeeks')statsWeeksOpen=e.target.open;if(e.target.id==='statsDiary')statsDiaryOpen=e.target.open;if(e.target.matches?.('details[data-acc]')){if(e.target.open&&e.target.dataset.acc.startsWith('train-')){for(let other of document.querySelectorAll('#training details[data-acc^="train-"]'))if(other!==e.target&&other.open)other.open=false;}let id=e.target.dataset.acc;if(e.target.open)openBackSections.add(id);else openBackSections.delete(id)}},true);

const HIIT_NAMES=['Step Jacks (ohne Springen)','Kniebeugen','Schnelle Boxbewegungen','Stehendes Knieheben','Liegestütze','Seitliche Schritte mit Armbewegungen'];
let timer={kind:'pause',seconds:60,remaining:60,running:false,end:0,interval:null,hiitSteps:[],step:0,lastBeep:null};
let audioCtx=null;
function signal(kind='start'){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const patterns={
   tick:[[1050,0,.10]],
   start:[[880,0,.15],[1320,.18,.23]],
   rest:[[520,0,.20],[420,.24,.20]],
   round:[[650,0,.14],[650,.19,.14],[900,.40,.24]],
   finish:[[780,0,.18],[980,.22,.18],[1240,.44,.40]]
  };
  for(const [hz,delay,duration] of (patterns[kind]||patterns.start)){
   const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;
   o.type=kind==='tick'?'square':'triangle';o.frequency.setValueAtTime(hz,t);
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='tick'?.16:.24,t+.012);
   g.gain.exponentialRampToValueAtTime(.0001,t+duration);
   o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.01);
  }
 }catch(e){}
}
function beep(times=1){signal(times===3?'finish':times===2?'rest':'start')}

function hiitSeconds(w){return w<=4?10:w===5?10:w===6?12:w===7?15:w===8||w===9?20:w===10||w===11?25:30}
function hiitSequence(w){let arr=[{label:'Start-Countdown',duration:3,type:'count'}];for(let round=1;round<=2;round++){for(let i=0;i<6;i++){arr.push({label:`Runde ${round}/2 · ${HIIT_NAMES[i]}`,duration:hiitSeconds(w),type:'work'});if(i<5)arr.push({label:'Pause · nächste Übung: '+HIIT_NAMES[i+1],duration:20,type:'rest'});}if(round===1)arr.push({label:'Rundenpause',duration:60,type:'rest'});}return arr}
function holdButton(it){let detail=String(it.detail||'');let m=detail.match(/(?:×\s*)?(\d+)\s*Sek\./i);if(!m)return '';return `<button type="button" class="btn secondary hold-start" data-hold="${Number(m[1])}" data-hold-name="${esc(it.name)}" style="margin:5px 0 12px">⏱ ${Number(m[1])} Sek. halten</button>`}
function timerPanel(){return `<div class="panel" id="timerPanel"><h3>⏱ Trainingstimer</h3><div class="row"><label for="timerKind">Timer auswählen</label><select id="timerKind"><option value="pause" ${timer.kind==='pause'?'selected':''}>Satzpause</option><option value="hold" ${timer.kind==='hold'?'selected':''}>Halte-Timer</option><option value="hiit" ${timer.kind==='hiit'?'selected':''}>HIIT · Woche ${week()}</option></select></div><div id="timerConfig" class="field">${timer.kind==='pause'?`<label for="pauseLength">Pausendauer (Sekunden)</label><input type="number" id="pauseLength" min="5" max="600" value="${timer.seconds}">`:timer.kind==='hold'?`<label for="holdLength">Haltezeit (Sekunden)</label><input type="number" id="holdLength" min="5" max="600" value="${timer.seconds}">`:`<p class="muted">${hiitSeconds(week())} Sek. Belastung / 20 Sek. Pause · 2 Runden · 60 Sek. Rundenpause</p>`}</div><div style="font-size:38px;font-weight:750;font-variant-numeric:tabular-nums" id="timerClock">${clock(timer.remaining)}</div><p id="timerLabel" class="muted" aria-live="polite">${timerLabel()}</p><p id="timerNextLabel" class="muted"></p><div class="navrow"><button class="btn" id="timerStart">${timer.running?'Pause':'Start / Fortsetzen'}</button><button class="btn secondary" id="timerReset">Zurücksetzen</button></div><p class="muted timer-help">Die Häkchen setzt du weiterhin selbst. HIIT: 3 kurze Countdown-Töne vor jedem Wechsel, deutliche unterschiedliche Signale für Belastung, Pause, Rundenpause und Ende. Für Signaltöne das Gerät nicht stummschalten und die App geöffnet lassen.</p></div>`}
function clock(v){let n=Math.max(0,Math.ceil(v));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function timerLabel(){return timer.kind==='hiit'?(timer.hiitSteps[timer.step]?.label||'HIIT bereit'):timer.kind==='hold'?'Haltezeit':'Satzpause'}
function timerDraw(){updateFloatingTimer();let a=el('timerClock'),b=el('timerLabel'),c=el('timerStart');if(a)a.textContent=clock(timer.remaining);if(b)b.textContent=timerLabel();if(c)c.textContent=timer.running?'Pause':'Start / Fortsetzen';let nxt=el('timerNextLabel');if(nxt)nxt.textContent=timer.kind==='hiit'&&timer.hiitSteps.length?'Danach: '+(timer.hiitSteps[timer.step+1]?.label||'Training abgeschlossen'):'';let fc=el('floatClock'),fn=el('floatName'),fs=el('floatStart');if(fc)fc.textContent=clock(timer.remaining);if(fn)fn.textContent=timerLabel();if(fs)fs.textContent=timer.running?'Pause':'Start';}
function timerStop(){timer.running=false;if(timer.interval){clearInterval(timer.interval);timer.interval=null}}
function timerReset(){timerStop();timer.step=0;timer.lastBeep=null;if(timer.kind==='hiit'){timer.hiitSteps=hiitSequence(timer.hiitWeek||week());timer.remaining=timer.hiitSteps[0].duration}else timer.remaining=timer.seconds;timerDraw()}
function timerNext(){if(timer.kind!=='hiit'){timerStop();timer.remaining=0;signal('finish');timerDraw();return}timer.step++;if(timer.step>=timer.hiitSteps.length){timerStop();timer.remaining=0;signal('finish');timerDraw();return}timer.remaining=timer.hiitSteps[timer.step].duration;timer.lastBeep=null;timer.end=Date.now()+timer.remaining*1000;signal(timer.hiitSteps[timer.step].type==='work'?'start':timer.hiitSteps[timer.step].duration===60?'round':'rest');timerDraw()}
function timerTick(){if(!timer.running)return;let r=Math.max(0,Math.ceil((timer.end-Date.now())/1000));if(((timer.kind==='hold'&&r<=5)||(timer.kind==='hiit'&&r<=3))&&r>0&&r!==timer.lastBeep){timer.lastBeep=r;signal('tick')}timer.remaining=r;if(r===0){timerNext();return}timerDraw()}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.classList.contains('hiit-direct-start')){timerStop();timer.kind='hiit';timer.hiitWeek=Number(b.dataset.hiitWeek)||week();timer.hiitSteps=hiitSequence(timer.hiitWeek);timer.step=0;timer.remaining=3;timer.lastBeep=null;let kind=el('timerKind');if(kind)kind.value='hiit';let config=el('timerConfig');if(config)config.innerHTML=`<p class="muted">${hiitSeconds(timer.hiitWeek)} Sek. Belastung / 20 Sek. Pause · 2 Runden · 60 Sek. Rundenpause. Automatischer Wechsel.</p>`;timerStart()}else if(b.id==='timerStart'||b.id==='floatStart'){timerStart()}else if(b.id==='floatOpen'){timerReset()}else if(b.id==='timerReset'){timerReset()}else if(b.classList.contains('hold-start')){timerStop();timer.kind='hold';timer.seconds=Number(b.dataset.hold);timer.remaining=timer.seconds;timer.lastBeep=null;let kind=el('timerKind');if(kind)kind.value='hold';let config=el('timerConfig');if(config)config.innerHTML=`<label for="holdLength">Haltezeit (Sekunden)</label><input type="number" id="holdLength" min="5" max="600" value="${timer.seconds}">`;timerDraw();timerStart()}});

function nutTrainingSuggestion(date){
 const start=fromDate(state.start),dt=fromDate(date),offset=Math.floor((dt-start)/86400000);
 const base={type:'Ruhetag',calories:1500,protein:110,carbs:80};
 if(offset<0||offset>=84)return base;
 const sources=calendarSources(date).filter(src=>fromDate(src).getDay()!==0);
 const extras=state.extra[date]||[];
 const names=sources.map(src=>DAYS[(fromDate(src).getDay()+6)%7]);
 const longExtra=extras.some(x=>/rad|lauf|wander|schwimm/i.test(x.name||'')&&nnum(x.min)>=60);
 const longPlanned=names.includes('Samstag');
 if(longExtra||longPlanned)return {type:'Ausdauertraining',calories:1800,protein:115,carbs:130};
 if(names.some(x=>['Montag','Dienstag','Donnerstag','Sonntag'].includes(x)))return {type:'Krafttraining',calories:1650,protein:115,carbs:100};
 if(names.some(x=>['Mittwoch','Freitag'].includes(x))||extras.some(x=>/rad|lauf|wander|schwimm/i.test(x.name||'')))return {type:'Ausdauertraining',calories:1800,protein:115,carbs:130};
 return base;
}
function nutDayTargets(date){
 const base=nutTrainingSuggestion(date), saved=nut.trainingTargets[date];
 const calories=(saved&&Number.isFinite(Number(saved.calories))&&Number(saved.calories)>=1000&&Number(saved.calories)<=5000)?Number(saved.calories):base.calories;
 const ratio=calories/base.calories;
 // All energy-bearing nutrient goals change with a manual calorie target. The fixed 20 g sugar limit does not.
 const protein=Math.round(base.protein*ratio),carbs=Math.round(base.carbs*ratio);
 const fat=Math.max(0,Math.round((calories-protein*4-carbs*4)/9));
 const fiber=Math.round(30*ratio);
 return {...base,calories,protein,carbs,fat,fiber,sugar:20,custom:calories!==base.calories};
}

function nutRelevantOnline(p,q){

 const name=nutNorm((p.product_name||'')+' '+(p.brands||''));

 return words.every(w=>name.includes(w));
}

let nutBlsFoods=null, nutBlsLoadPromise=null, nutBlsError='';
function nutBlsLoad(){
 if(nutBlsFoods)return Promise.resolve(nutBlsFoods);
 if(!nutBlsLoadPromise)nutBlsLoadPromise=fetch('./bls-daten.json').then(r=>{
  if(!r.ok)throw Error('HTTP '+r.status);return r.json();
 }).then(rows=>{
  if(!Array.isArray(rows))throw Error('Ungültiges Datenformat');
  nutBlsFoods=rows;nutBlsError='';return rows;
 }).catch(e=>{nutBlsLoadPromise=null;nutBlsError=e.message;throw e});
 return nutBlsLoadPromise;
}
function nutBlsProduct(row){

 return {product_name:row[1],brands:'BLS 4.0 · '+row[0],bls:true,

}
async function nutSearch(extended=false){
 const q=(nval('nutQuery')||'').trim(),seq=++nutSearchSeq;
 if(!extended){nutVisibleCount=8;nutSearchPage=1}
 if(!q){nutShowResults(nutSavedMatches(''),'Eigene Lebensmittel und Favoriten · BLS-Suche bereit');return}
 const saved=nutSavedMatches(q);
 if(q.length<2){nutShowResults(saved,'Bitte mindestens zwei Buchstaben eingeben.');return}
 nutShowResults(saved,'Durchsuche den Bundeslebensmittelschlüssel 4.0 …');
 try{
  const rows=await nutBlsLoad();if(seq!==nutSearchSeq)return;
  const term=nutNorm(q),words=term.split(/\s+/).filter(Boolean);
  const hits=rows.filter(r=>words.every(w=>nutNorm(r[1]).includes(w)));
  hits.sort((a,b)=>{
   const aName=nutNorm(a[1]),bName=nutNorm(b[1]);
   const score=n=>(n===term?0:n.startsWith(term)?1:2);
   return score(aName)-score(bName)||aName.localeCompare(bName,'de');
  });
  const products=hits.slice(0,250).map(nutBlsProduct);
  const seen=new Set(saved.map(nutKey));
  const combined=[...saved,...products.filter(p=>{let k=nutKey(p);if(seen.has(k))return false;seen.add(k);return true})];
  if(extended)nutVisibleCount=Math.min(250,nutVisibleCount+30);
  nutShowResults(combined,hits.length+' BLS-Treffer · '+rows.length.toLocaleString('de-DE')+' Lebensmittel lokal verfügbar'+(hits.length>250?' · bitte Suche eingrenzen':''));
 }catch(e){if(seq===nutSearchSeq)nutShowResults(saved,'BLS-Daten konnten nicht geladen werden ('+String(e.message||e)+'). Bitte alle Dateien gemeinsam über Live Server öffnen.');}
}
