me": "Beinstrecken am Beinaufsatz", "detail": "vordere Oberschenkel"}, {"name": "Beinbeugen am Beinaufsatz oder stehend", "detail": "hintere Oberschenkel"}, {"name": "Glute Bridge mit kurzem Halt", "detail": "Po · 2 Sek. oben"}, {"name": "Brustdrücken ODER leichte Brust-Flys", "detail": "Bank · kontrolliert"}, {"name": "Abgestütztes Rudern", "detail": "Hanteln"}, {"name": "Schulterdrücken im Sitzen ODER Frontheben", "detail": "nur ohne Rückenreizung"}, {"name": "Trizeps-Kickbacks", "detail": "Hanteln"}, {"name": "Wadenheben", "detail": "12–20 Wiederholungen"}]}, "Freitag": {"title": "Laufband, Balance & Koordination", "items": [{"name": "Gehen auf dem Laufband; Laufintervalle nur wenn verträglich", "detail": "Dauer nach Wochenübersicht"}, {"name": "Balanceboard, beidbeinig", "detail": "Dauer nach Wochenübersicht"}, {"name": "Einbeinstand mit Knieheben", "detail": "6–10 / Seite · Halt möglich"}, {"name": "Hüftabduktion im Einbeinstand", "detail": "8–12 / Seite · mit Halt"}, {"name": "Vibrationsplatte", "detail": "freigegebene Einstellungen"}]}, "Samstag": {"title": "Radfahren & Geräte", "items": [{"name": "Fahrrad auf der Radrolle", "detail": "Dauer nach Wochenübersicht"}, {"name": "Balanceboard: kontrollierte Gewichtsverlagerung", "detail": "3 × 45–60 Sek."}, {"name": "Vibrationsplatte", "detail": "freigegebene Einstellungen"}, {"name": "Optional: Hula-Hoop", "detail": "nur wenn beschwerdefrei"}]}, "Sonntag": {"title": "Regeneration", "items": [{"name": "Trainingsfrei / lockerer Spaziergang", "detail": "Rückenprogramm wie gewohnt"}]}}];
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const BACK=[{title:'Morgens · Mobilisation',items:['Sanfte Mobilisation im schmerzfreien Bereich','Ruhige Atem- und Aufrichtungsübung']},{title:'Mittags · Stabilisation',items:['Sanfte Rumpfstabilisation nach Verträglichkeit','Kontrollierte Rückenübung aus deinem abgestimmten Programm']},{title:'Abends · Entlastung',items:['Entlastende Position und ruhiges Atmen','Sanfte Dehnung ohne Ausstrahlung']},{title:'Regeneration · optional',items:['Moorkissen / Wärme nach Bedarf','Schröpfen nur nach fachlicher Rücksprache','Massagegürtel nach Bedarf']}];
const STORE='body-balance-v1';let state;try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch{state={}};state.checks ||= {};state.notes ||= {};state.minutes ||= {};state.start ||= new Date().toLocaleDateString('sv-SE');state.manualWeek ||= 0;
let chosen=new Date().toLocaleDateString('sv-SE'),tab='today';
const el=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert('Speichern nicht möglich. Bitte Daten exportieren.')}}
function isoDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fromDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function week(){if(state.manualWeek>0)return state.manualWeek;let delta=Math.floor((fromDate(chosen)-fromDate(state.start))/86400000);return Math.max(1,Math.min(12,Math.floor(delta/7)+1))}
function day(){return DAYS[(fromDate(chosen).getDay()+6)%7]}
function block(){return Math.min(2,Math.floor((week()-1)/4))}
function key(prefix,idx){return `${chosen}|${prefix}|${idx}`}
function checkbox(prefix,items){return items.map((it,i)=>{let id=key(prefix,i),checked=!!state.checks[id];return `<label class="check"><input type="checkbox" data-key="${esc(id)}" ${checked?'checked':''}><span><strong>${esc(it.name||it)}</strong>${it.detail?`<small>${esc(it.detail)}</small>`:''}</span></label>`}).join('')}
function progress(prefix,items){let n=items.filter((_,i)=>state.checks[key(prefix,i)]).length;return {n,total:items.length,pct:items.length?Math.round(n/items.length*100):0}}
function bar(p){return `<div class="row"><span class="muted">${p.n} von ${p.total} erledigt</span><span class="badge">${p.pct} %</span></div><div class="bar"><span style="width:${p.pct}%"></span></div>`}
function datepicker(){return `<div class="field"><label for="dayselect">Trainingstag auswählen</label><input id="dayselect" type="date" value="${chosen}"></div>`}
function today(){let d=day(),item=PLAN[block()][d],p=progress('train',item.items),bp=BACK.map((b,i)=>progress('back'+i,b.items)),n=bp.reduce((a,b)=>a+b.n,0),total=bp.reduce((a,b)=>a+b.total,0);el('today').innerHTML=`<div class="panel"><div class="row"><div><div class="eyebrow">Dein Tagesüberblick</div><h2>${esc(d)} · Woche ${week()}</h2></div><span class="pill">Block ${block()+1} / 3</span></div>${datepicker()}<div class="row"><strong>Heutiges Training</strong><span class="muted">${esc(item.title)}</span></div>${bar(p)}<button class="btn" data-go="training">Übungen ansehen →</button></div><div class="panel"><div class="sectionhead"><h3>Dein Rückenprogramm</h3><span class="badge">${n}/${total}</span></div><div class="bar"><span style="width:${Math.round(n/total*100)}%"></span></div><p class="muted">Morgens, mittags, abends und optionale Regeneration</p><button class="btn secondary" data-go="back">Rückenprogramm öffnen</button></div><p class="notice">Die Rückenübungen sind vorläufige Platzhalter, keine medizinisch abgestimmte Anleitung. Bei neuen oder stärkeren ausstrahlenden Schmerzen, Taubheit oder Schwäche bitte Training unterbrechen und ärztlich abklären.</p>`}
function training(){let d=day(),item=PLAN[block()][d];el('training').innerHTML=`<div class="eyebrow">Trainingsplan · Woche ${week()}</div><h2>Dein Ganzkörpertraining</h2>${datepicker()}<div class="daychips">${DAYS.map(x=>`<button data-day="${x}" class="${x===d?'active':''}">${x.slice(0,2)}</button>`).join('')}</div><div class="panel"><div class="sectionhead"><h3>${esc(d)} · ${esc(item.title)}</h3><span class="pill">W${week()}</span></div>${bar(progress('train',item.items))}${checkbox('train',item.items)}</div><div class="panel"><h3>Dein Trainingstagebuch</h3><div class="field"><label for="minutes">Rad-/Laufbandminuten (heute insgesamt)</label><input id="minutes" type="number" min="0" max="600" inputmode="numeric" value="${state.minutes[chosen]??''}" placeholder="z. B. 30"></div><div class="field"><label for="note">Notizen, Gewichte, Rückenbefinden</label><textarea id="note" placeholder="Wie lief das Training?">${esc(state.notes[chosen]||'')}</textarea></div><button class="btn" id="saveNote">Eintrag speichern</button></div>`}
function back(){el('back').innerHTML=`<div class="eyebrow">Jeden Tag</div><h2>Rücken & Regeneration</h2>${datepicker()}<p class="notice">Die genauen Übungen aus deinem persönlichen Rückenplan sind hier noch nicht übernommen. Die folgenden Punkte dienen zunächst als Checkliste. Belastung und Schröpfen bitte bei deiner Vorgeschichte fachlich abstimmen.</p>${BACK.map((b,i)=>`<div class="panel"><div class="sectionhead"><h3>${esc(b.title)}</h3><span class="badge">${progress('back'+i,b.items).n}/${b.items.length}</span></div>${checkbox('back'+i,b.items)}</div>`).join('')}`}
function stats(){let keys=Object.keys(state.checks).filter(k=>state.checks[k]);let dates=new Set(keys.map(k=>k.split('|')[0]));let mins=Object.values(state.minutes).reduce((a,b)=>a+(Number(b)||0),0);let byDay={};keys.forEach(k=>{let d=k.split('|')[0];byDay[d]=(byDay[d]||0)+1});let recent=Object.entries(byDay).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);el('stats').innerHTML=`<div class="eyebrow">Deine Entwicklung</div><h2>Trainingsfortschritt</h2><div class="two"><div class="stat"><b>${dates.size}</b><small>Tage mit Häkchen</small></div><div class="stat"><b>${keys.length}</b><small>Erledigte Punkte</small></div><div class="stat"><b>${mins}</b><small>Erfasste Ausdauerminuten</small></div><div class="stat"><b>${Object.keys(state.notes).filter(x=>state.notes[x]).length}</b><small>Tagebucheinträge</small></div></div><div class="panel" style="margin-top:14px"><h3>Letzte Trainingstage</h3>${recent.length?recent.map(([d,n])=>`<div class="check"><span><strong>${esc(d)}</strong><small>${n} erledigte Punkte</small></span></div>`).join(''):'<p class="muted">Sobald du Übungen abhaken kannst, erscheint hier dein Verlauf.</p>'}</div><p class="notice">Die Minuten werden als Gesamtdauer pro Tag erfasst; Rad und Laufband sind derzeit noch nicht getrennt.</p>`}
function settings(){el('settings').innerHTML=`<div class="eyebrow">Personalisierung & Datensicherung</div><h2>Einstellungen</h2><div class="panel"><div class="field"><label for="start">Beginn deiner 12 Trainingswochen</label><input type="date" id="start" value="${esc(state.start)}"></div><div class="field"><label for="manual">Trainingswoche</label><select id="manual"><option value="0">Automatisch nach Startdatum</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${state.manualWeek===i+1?'selected':''}>Woche ${i+1}</option>`).join('')}</select></div><button class="btn" id="saveSettings">Einstellungen speichern</button></div><div class="panel"><h3>Deine Daten sichern</h3><p class="muted">Alle Häkchen und Notizen werden auf diesem Gerät gespeichert. Exportiere regelmäßig eine Sicherungsdatei, da Browserdaten gelöscht werden können.</p><div class="navrow"><button class="btn secondary" id="export">Sicherung exportieren</button><label class="btn outline" for="import">Sicherung importieren</label><input type="file" id="import" accept="application/json,.json" class="hidden"></div></div><div class="panel"><h3>Über die erste Version</h3><p class="muted">Die Ganzkörperübungen stammen aus deinen drei Trainingsplan-PDFs. Das Rückenprogramm ist noch nicht vollständig übernommen. Die App ist lokal nutzbar; für die Installation auf dem iPhone muss sie über HTTPS bereitgestellt werden.</p><button class="btn outline danger" id="reset">Alle gespeicherten Daten löschen</button></div>`}
function render(){today();training();back();stats();settings();for(let id of ['today','training','back','stats','settings'])el(id).classList.toggle('hidden',id!==tab);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.addEventListener('change',e=>{if(e.target.matches('input[data-key]')){state.checks[e.target.dataset.key]=e.target.checked;save();render()}if(e.target.id==='dayselect'){if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){chosen=e.target.value;render()}}if(e.target.id==='import'){let f=e.target.files[0];if(!f)return;if(f.size>2e6){alert('Datei ist zu groß.');return}f.text().then(t=>{let v=JSON.parse(t);if(!v||typeof v!=='object'||typeof v.checks!=='object')throw Error();if(confirm('Vorhandene Daten durch die Sicherung ersetzen?')){state={checks:v.checks||{},notes:v.notes||{},minutes:v.minutes||{},start:v.start||state.start,manualWeek:Number(v.manualWeek)||0};save();render()}}).catch(()=>alert('Die Sicherungsdatei konnte nicht gelesen werden.'))}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab||b.dataset.go){tab=b.dataset.tab||b.dataset.go;render();window.scrollTo(0,0)}if(b.dataset.day){let offset=DAYS.indexOf(b.dataset.day)-DAYS.indexOf(day());let dt=fromDate(chosen);dt.setDate(dt.getDate()+offset);chosen=isoDate(dt);render()}if(b.id==='saveNote'){let m=el('minutes').value;state.minutes[chosen]=m===''?'':Math.max(0,Math.min(600,Number(m)||0));state.notes[chosen]=el('note').value.slice(0,5000);save();render();alert('Eintrag gespeichert.')}if(b.id==='saveSettings'){state.start=el('start').value||state.start;state.manualWeek=Number(el('manual').value)||0;save();render();alert('Einstellungen gespeichert.')}if(b.id==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='body-and-balance-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(b.id==='reset'&&confirm('Wirklich alle Häkchen, Notizen und Einstellungen löschen?')){localStorage.removeItem(STORE);location.reload()}});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
